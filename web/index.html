<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>物序 ERP</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/walkthrough.js"></script>
  <script defer src="/industry.js"></script>
  <script defer src="/orders.js"></script>
  <script defer src="/execution.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <section id="login-screen" class="login-screen" hidden>
    <div class="login-cover">
      <div class="brand"><span class="mark"></span><span>物序 <small>ERP</small></span></div>
      <div class="cover-copy"><h1>工业供应链<br>运营工作台</h1><p>采购、生产、库存、交付与应收应付。</p></div>
      <div class="cover-grid" aria-hidden="true"></div>
    </div>
    <div class="login-content">
      <form id="login-form">
        <h2 id="login-title">登录工作台</h2>
        <label>账号<input name="username" autocomplete="username" required></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
        <p id="login-error" class="form-error" role="alert" hidden></p>
        <button type="submit" class="button primary">登录 <span aria-hidden="true">→</span></button>
      </form>
    </div>
  </section>
  <div id="app" class="layout" hidden>
    <aside id="sidebar" class="sidebar">
      <div class="brand"><span class="mark"></span><span>物序 <small>ERP</small></span></div>
      <nav id="nav" aria-label="业务导航"></nav>
      <div class="sidebar-footer">
        <button id="account" class="account" type="button" title="更改密码"></button>
        <button id="logout" class="logout" type="button" title="退出登录" aria-label="退出登录">↪</button>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="path"><button id="navigation-toggle" class="button icon-button" type="button" aria-label="展开业务导航" aria-expanded="false">☰</button><span>运营工作台</span><b aria-hidden="true">/</b><strong id="crumb"></strong></div>
        <div class="top-actions"><button id="demo-launch" class="button small" type="button" data-action="walkthroughStart" hidden>实操演示</button><span id="mode" class="mode" hidden><i></i>演示数据</span><span id="business-date" class="business-date"></span><button id="refresh" type="button" class="button icon-button" aria-label="刷新数据" title="刷新数据">↻</button></div>
      </header>
      <section id="walkthrough" class="walkthrough" aria-label="逐步演示" hidden></section>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
  <div id="starting" class="starting" role="status">正在连接工作台…</div>
  <dialog id="dialog">
    <div class="dialog-bar"><h2 id="dialog-title"></h2><button id="dialog-close" class="button icon-button" aria-label="关闭">×</button></div>
    <div id="dialog-body" class="dialog-body"></div>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>

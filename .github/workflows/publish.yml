name: 验证并发布 ERP 镜像

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: erp-publish-main
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      ERP_IMAGE: wuxu-erp:ci
      ERP_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: 运行本地回归测试
        run: python3 -B -m unittest discover -s tests -v

      - name: 生成本次验证所需口令
        run: |
          python3 - <<'PY'
          import os
          import secrets

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              print("ERP_DEMO_LOGIN=1", file=env)
              for name in ("ERP_ADMIN_PASSWORD", "ERP_DB_PASSWORD"):
                  value = secrets.token_urlsafe(24)
                  print("::add-mask::" + value)
                  print(f"{name}={value}", file=env)
          PY

      - name: 用 PostgreSQL 验证工业业务与急单
        run: |
          docker compose up -d --build --wait --wait-timeout 180
          python3 - <<'PY'
          from datetime import date, timedelta
          import http.cookiejar
          import json
          import urllib.request

          root = "http://127.0.0.1:8787"
          client = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar())
          )
          with client.open(root + "/api/health", timeout=10) as response:
              assert json.load(response) == {"ok": True, "db": "postgresql"}
          with client.open(root + "/api/meta", timeout=10) as response:
              assert response.headers["Cache-Control"] == "no-store"
              meta = json.load(response)
          assert meta["demo_login"]
          credentials = meta["demo_account"]
          assert credentials["username"] == "admin"
          login = urllib.request.Request(
              root + "/api/login", data=json.dumps(credentials).encode(),
              headers={"Content-Type": "application/json"},
          )
          with client.open(login, timeout=10) as response:
              assert response.headers["Cache-Control"] == "no-store"
              assert json.load(response) == {"ok": True}
          with client.open(root + "/api/state", timeout=10) as response:
              state = json.load(response)
          assert state["account"]["is_demo"]
          assert state["sites"] and all(row["type"] == "factory" for row in state["sites"])
          assert state["items"] and all(row["type"] in {"material", "product"} for row in state["items"])
          with client.open(root + "/api/walkthrough", timeout=10) as response:
              assert json.load(response)["practice_allowed"]
          order = next(row for row in state["documents"] if row["kind"] == "sale")
          payload = {"id": order["id"], "operation": "schedule", "priority": "critical",
                     "owner": "发布验证", "due": (date.fromisoformat(state["today"]) + timedelta(days=1)).isoformat(),
                     "note": "验证原销售单急单跟进"}
          expedite = urllib.request.Request(root + "/api/action/expedite", data=json.dumps(payload).encode(),
                                           headers={"Content-Type": "application/json"})
          with client.open(expedite, timeout=10) as response:
              assert json.load(response)["id"] == order["id"]
          with client.open(root + "/api/orders/expedite/" + order["id"], timeout=10) as response:
              desk = json.load(response)
          assert desk["ticket"]["priority"] == "critical" and desk["work"] and desk["events"]

          def api(path, payload=None):
              req = root + path if payload is None else urllib.request.Request(
                  root + path, data=json.dumps(payload).encode(), headers={"Content-Type": "application/json"})
              with client.open(req, timeout=10) as response:
                  return json.load(response)

          tomorrow = (date.fromisoformat(state["today"]) + timedelta(days=1)).isoformat()
          case = api("/api/action/practice", {"mode": "rush"})
          guide = api("/api/walkthrough?run=" + case["id"])
          assert guide["rush"] and not guide["ready"]["slot"]
          line = next(line for line in api("/api/execution/production")["lines"] if line["site_id"] == guide["site_id"])
          api("/api/action/schedule_work", {"id": guide["work"]["id"], "line_id": line["id"], "day": tomorrow,
                                           "start": "08:00", "minutes": "90", "note": "排程发布验证"})
          assert api("/api/walkthrough?run=" + case["id"])["ready"]["slot"]
          sale = api("/api/document/" + order["id"])
          batch = next(row for row in state["lots"] if row["code"] == "FG-DEMO-001")
          api("/api/action/inspect", {"lot_id": batch["id"], "verdict": "released", "note": "验证成品放行"})
          api("/api/action/reserve_stock", {"id": sale["id"], "lot_id": batch["id"], "quantity": "4", "note": "锁料发布验证"})
          line_id = sale["lines"][0]["id"]
          for _ in range(2):
              api("/api/action/delivery_commitment",
                  {"id": sale["id"], "line_id": line_id, "quantity": "2", "due": tomorrow, "note": "分批承诺发布验证"})
          delivery = api("/api/document/" + sale["id"])["commitments"][0]
          api("/api/action/ship", {"id": sale["id"], "line_id": line_id, "commitment_id": delivery["id"], "quantity": "2"})
          assert api("/api/industry/transport")["pending"][0]["commitment_id"] == delivery["id"]
          api("/api/action/dispatch", {"id": sale["id"], "commitment_id": delivery["id"], "due": tomorrow,
                                      "carrier": "验证承运商", "tracking": "CI-POD-01"})
          transport = api("/api/industry/transport")["shipments"][0]
          api("/api/action/sign_shipment", {"id": transport["id"], "receipt": "CI-RECEIPT-01"})
          assert sum(row["signed"] for row in api("/api/document/" + sale["id"])["commitments"]) == 2000
          PY

      - name: 发布镜像并用 Compose 回拉验证
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          revision="$image:sha-$GITHUB_SHA"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          docker tag "$ERP_IMAGE" "$revision"
          docker push "$revision"
          ERP_IMAGE="$revision" docker compose -f compose.server.yaml pull app
          ERP_IMAGE="$revision" docker compose -f compose.server.yaml up -d --wait --wait-timeout 180
          docker tag "$revision" "$image:main"
          docker push "$image:main"

      - name: 启动失败时查看容器日志
        if: failure()
        run: docker compose logs --tail=100

      - name: 停止临时容器
        if: always()
        run: docker compose down
